name: Build and Deploy BG Jobs

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger bhi de sakte ho

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # ✅ v4 uses Node.js 24
      
      - name: Set up Python
        uses: actions/setup-python@v5  # ✅ v5 uses Node.js 24
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Agar koi extra package chahiye to yaha add karo
          # pip install beautifulsoup4 requests
      
      - name: Generate HTML Pages
        run: python build.py
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4  # ✅ v4 uses Node.js 24
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '🚀 Auto-deploy BG Jobs site'
