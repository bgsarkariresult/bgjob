name: Build and Deploy BG Jobs

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger bhi de sakte ho

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # ✅ v4 uses Node.js 24
      
      - name: Set up Python
        uses: actions/setup-python@v5  # ✅ v5 uses Node.js 24
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Agar koi extra package chahiye to yaha add karo
          # pip install beautifulsoup4 requests
      
      - name: Generate HTML Pages
        run: python build.py
      
      - name: Commit Generated HTML Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git add jobs/index.html jobs/*.html 2>/dev/null || true
          git add results/index.html 2>/dev/null || true
          git add admit-card/index.html 2>/dev/null || true
          git add answer-key/index.html 2>/dev/null || true
          git add syllabus/index.html 2>/dev/null || true
          git add books/index.html 2>/dev/null || true
          git status
          git diff --staged --quiet || (git commit -m "🤖 Auto-build HTML pages from jobs.json" && git push origin main)
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4  # ✅ v4 uses Node.js 24
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '🚀 Auto-deploy BG Jobs site'
